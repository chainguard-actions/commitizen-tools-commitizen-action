name: Test devrelease version bump
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up commitizen config for devrelease bump
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Write a .cz.toml config with explicit tag_format
          printf '[tool.commitizen]\nname = "cz_conventional_commits"\nversion = "1.5.0"\ntag_format = "v$version"\n' > .cz.toml

          git add .cz.toml
          git commit -m "chore: add commitizen config"

          # Tag the current version
          git tag v1.5.0

          # Set up a git origin reachable inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          devrelease: "1"
          increment: "MINOR"
          commit: "false"
          push: "false"
          changelog: "false"
          no_raise: "21"

      - name: Assert previous_version is 1.5.0
        env:
          PREV: ${{ steps.action.outputs.previous_version }}
        run: |
          echo "previous_version: $PREV"
          if [ "$PREV" != "1.5.0" ]; then
            echo "FAIL: expected previous_version=1.5.0 but got '$PREV'"
            exit 1
          fi
          echo "PASS: previous_version=1.5.0"

      - name: Assert next_version is set and contains dev marker
        env:
          PREV: ${{ steps.action.outputs.previous_version }}
          NEXT: ${{ steps.action.outputs.next_version }}
        run: |
          echo "previous_version: $PREV"
          echo "next_version: $NEXT"
          if [ -z "$NEXT" ]; then
            echo "FAIL: next_version is empty"
            exit 1
          fi
          if [ "$PREV" = "$NEXT" ]; then
            echo "FAIL: version was not bumped (prev=$PREV, next=$NEXT)"
            exit 1
          fi
          echo "PASS: version bumped from $PREV to $NEXT"

      - name: Assert next_version contains dev marker
        env:
          NEXT: ${{ steps.action.outputs.next_version }}
        run: |
          echo "next_version: $NEXT"
          if ! echo "$NEXT" | grep -qiE 'dev|\.dev'; then
            echo "FAIL: expected next_version to contain 'dev' marker but got '$NEXT'"
            exit 1
          fi
          echo "PASS: next_version=$NEXT contains dev marker"
